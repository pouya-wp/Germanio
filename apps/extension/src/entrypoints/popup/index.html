<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Germanio</title>
    <style>
      :root { --paper: #f2efe8; --ink: #0e0e10; --muted: #6f6d67; --line: #d8d3c8; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --paper: #17171b; --ink: #f2efe8; --muted: #8d8b84; --line: #2a2a30; } }
      body { margin: 0; width: 280px; background: var(--paper); color: var(--ink); font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; border-bottom: 1px solid var(--ink); }
      .brand { font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
      .label { font: 10px/1.2 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      dl { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 0; }
      dl div { padding: 14px 16px; border-bottom: 1px solid var(--line); }
      dd { margin: 4px 0 0; font-size: 26px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
      a { display: block; padding: 12px 16px; color: var(--ink); text-decoration: none; font-weight: 550; }
      a:hover { background: var(--ink); color: var(--paper); }
      p { margin: 0; padding: 12px 16px; color: var(--muted); }
      kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); padding: 1px 4px; }
    </style>
  </head>
  <body>
    <header><span class="brand">Germanio</span><span class="label" id="state">…</span></header>
    <dl>
      <div><dt class="label">Fällig</dt><dd id="due">–</dd></div>
      <div><dt class="label">Neu</dt><dd id="new">–</dd></div>
      <div><dt class="label">Std.</dt><dd id="hours">–</dd></div>
    </dl>
    <a href="http://localhost:3000/wortschatz" target="_blank" rel="noopener">Wiederholen →</a>
    <p><kbd>Alt</kbd> + Klick auf ein Wort · <kbd>Alt</kbd><kbd>⇧</kbd><kbd>D</kbd> für Markiertes</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
