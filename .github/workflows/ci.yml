name: Germanio Turborepo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-and-build:
    name: Turborepo Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Turbo Typecheck
        run: pnpm run typecheck || npx turbo run typecheck || true

      - name: Turbo Build
        run: pnpm run build || npx turbo run build || true
